name: Deploy Afterglow to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'outputs/afterglow/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the static website
        run: |
          mkdir -p _site
          cp outputs/afterglow/*.html outputs/afterglow/*.css outputs/afterglow/*.js outputs/afterglow/*.svg _site/
          cp outputs/afterglow/.nojekyll _site/
          cp -R outputs/afterglow/posters _site/posters

      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
