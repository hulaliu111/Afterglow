name: 定期更新片库

on:
  schedule:
    # 每周一 UTC 03:00（北京时间 11:00）自动抓取一次
    - cron: "0 3 * * 1"
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write # 允许把更新后的数据 push 回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取豆瓣 Top 250
        run: python3 scripts/fetch_douban.py

      - name: 抓取 TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_tmdb.py

      - name: 抓取一周口碑榜
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_chart.py

      - name: 生成 data.js
        run: python3 scripts/build_data.py

      - name: 生成独立电影系列目录
        run: python3 scripts/build_movie_series.py

      - name: 下载海报到本地
        run: python3 scripts/download_posters.py

      - name: 更新 TMDB 精选剧集
        continue-on-error: true # 单独刷新；失败保留上次成功的剧集资料
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_series.py --refresh

      - name: 更新 TVmaze 精选剧集
        continue-on-error: true # 无需密钥；失败保留旧片库
        run: python3 scripts/fetch_tvmaze_series.py --refresh

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "自动更新片库数据（豆瓣 + TMDB）"
            git push
          fi
